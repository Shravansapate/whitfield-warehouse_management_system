name: WMS CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: whitfield_wms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d whitfield_wms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres-test-password@127.0.0.1:5432/whitfield_wms_test
      E2E_DATABASE_URL: postgresql+asyncpg://postgres:postgres-test-password@127.0.0.1:5432/whitfield_wms_e2e_test
      JWT_SECRET_KEY: whitfield-wms-ci-secret-key-not-for-production-use
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Create isolated browser test database
        env:
          PGPASSWORD: postgres-test-password
        run: createdb --host 127.0.0.1 --port 5432 --username postgres whitfield_wms_e2e_test

      - name: Verify backend
        run: |
          python -m ruff check backend
          python -m ruff format --check backend
          python -m mypy backend --no-incremental
          python -m pytest backend/tests -q
          DATABASE_URL="$TEST_DATABASE_URL" python -m alembic -c backend/alembic.ini check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run build
          npm audit --omit=dev

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify browser acceptance flows
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
